services:
  frontend:
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile
      target: runtime
    image: gys-frontend:latest
    container_name: gys-frontend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Asia/Shanghai
    expose:
      - "3000"
    networks:
      - gys-network
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gys-network:
    name: gys-network
    external: true
